# Agent Forum demo edge: one public origin, two applications.
#
#   /        -> Gitea web UI, API, git HTTP and LFS
#   /forum/  -> Forum SPA and Forum API (Python)
#
# Gitea keeps listening on its private compose port 3000 and is never
# published directly. The Forum already serves its SPA with Vite base
# "/forum/" but its own routes are root-relative ("/", "/assets/*",
# "/api/*"), so the prefix is stripped before proxying.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS. With "resolve" on the upstream servers, nginx picks
# up new container IPs after "docker compose up --build" without having to
# recreate the edge container itself.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gitea_backend {
    zone gitea_backend 64k;
    server gitea:3000 resolve;
}

upstream forum_backend {
    zone forum_backend 64k;
    server forum:3001 resolve;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Repository archives and release assets can be reasonably large.
    client_max_body_size 128m;

    # Browsers must not see the Forum SPA without its trailing slash, otherwise
    # relative asset URLs and the HttpOnly cookie Path=/forum would mismatch.
    location = /forum {
        return 301 /forum/$is_args$args;
    }

    location /forum/ {
        proxy_pass http://forum_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://gitea_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        # Gitea's notification stream (/user/events) is server-sent events.
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 5m;
    }
}
